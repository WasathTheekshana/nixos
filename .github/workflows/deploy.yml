name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-waznix
  cancel-in-progress: false

jobs:
  deploy-waznix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_CI_AUTHKEY }}

      - name: Configure deploy SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$WAZNIX_HOST" >> ~/.ssh/known_hosts
        env:
          WAZNIX_HOST: ${{ secrets.WAZNIX_TAILSCALE_HOST }}

      - name: nixos-rebuild switch
        run: |
          nix run nixpkgs#nixos-rebuild -- switch \
            --flake .#waznix \
            --target-host "deploy@${WAZNIX_HOST}" \
            --build-host localhost \
            --use-remote-sudo
        env:
          WAZNIX_HOST: ${{ secrets.WAZNIX_TAILSCALE_HOST }}
